<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zümrüt İç Giyim & Çeyiz Katalog</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 90px; }
        
        header { background: linear-gradient(135deg, #e91e63, #8e24aa); color: white; text-align: center; padding: 25px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        header p { font-size: 14px; opacity: 0.9; }

        .search-container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        .search-input { width: 100%; padding: 12px 18px; border: 2px solid #ddd; border-radius: 25px; font-size: 15px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #e91e63; box-shadow: 0 0 8px rgba(233,30,99,0.2); }

        .categories { display: flex; overflow-x: auto; padding: 5px 15px 15px 15px; gap: 10px; justify-content: start; max-width: 800px; margin: 0 auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; background-color: white; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; color: #555; }
        .cat-btn.active, .cat-btn:hover { background-color: #e91e63; color: white; border-color: #e91e63; }

        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: 0.3s; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; background-color: #eee; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: 600; color: #222; margin-bottom: 6px; }
        .card-price { font-size: 16px; font-weight: bold; color: #e91e63; margin-bottom: 10px; }
        
        .btn-add { background-color: #25d366; color: white; border: none; width: 100%; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-add:hover { background-color: #1ebd59; }

        /* Admin Kontrolleri */
        .admin-controls { margin-top: 8px; display: flex; gap: 5px; }
        .btn-edit { background: #ff9800; color: white; border: none; padding: 5px; border-radius: 4px; font-size: 11px; cursor: pointer; flex: 1; }
        .btn-del { background: #f44336; color: white; border: none; padding: 5px; border-radius: 4px; font-size: 11px; cursor: pointer; flex: 1; }

        /* Sepet Bar */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; border-radius: 15px 15px 0 0; z-index: 100; }
        .cart-info { font-size: 14px; font-weight: 600; }
        .cart-total { color: #e91e63; font-size: 16px; font-weight: bold; }
        .btn-order { background-color: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; }

        /* Admin Giriş & Panel */
        .admin-toggle-btn { position: fixed; bottom: 75px; right: 15px; background: #333; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; z-index: 101; opacity: 0.8; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn-save { background: #e91e63; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #ccc; color: #333; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        .empty-state { text-align: center; padding: 40px 20px; color: #777; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <h1>Zümrüt İç Giyim & Çeyiz</h1>
        <p>Sultanbeyli Merkez | Online Ürün Kataloğu</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Ürün veya kategori ara..." onkeyup="filterProducts()">
    </div>

    <div class="categories" id="categoryContainer">
        <button class="cat-btn active" onclick="setCategory('Hepsi')">Hepsi</button>
        <button class="cat-btn" onclick="setCategory('İç Giyim')">İç Giyim</button>
        <button class="cat-btn" onclick="setCategory('Çeyiz')">Çeyiz</button>
        <button class="cat-btn" onclick="setCategory('Pijama & Gecelik')">Pijama & Gecelik</button>
        <button class="cat-btn" onclick="setCategory('Aksesuar & Çorap')">Aksesuar & Çorap</button>
    </div>

    <div class="container">
        <div class="grid" id="productGrid">
            <div class="empty-state">Ürünler yükleniyor...</div>
        </div>
    </div>

    <!-- Sepet Alt Barı -->
    <div class="cart-bar" id="cartBar" style="display: none;">
        <div class="cart-info">
            <span id="cartCount">0</span> Ürün | <span class="cart-total" id="cartTotal">0 TL</span>
        </div>
        <button class="btn-order" onclick="sendWhatsAppOrder()">
            📱 WhatsApp ile Sipariş Ver
        </button>
    </div>

    <!-- Yönetici Paneli Butonu -->
    <button class="admin-toggle-btn" onclick="toggleAdminPanel()">🔑 Yönetici / Ürün Ekle</button>

    <!-- Ürün Ekleme / Düzenleme Modalı -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3 id="modalTitle">Yeni Ürün Ekle</h3>
            <input type="hidden" id="editProductId">
            <div class="form-group">
                <label>Ürün Adı</label>
                <input type="text" id="prodName" placeholder="Örn: Saten Gecelik Takımı">
            </div>
            <div class="form-group">
                <label>Fiyat (TL)</label>
                <input type="number" id="prodPrice" placeholder="Örn: 450">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="prodCat">
                    <option value="İç Giyim">İç Giyim</option>
                    <option value="Çeyiz">Çeyiz</option>
                    <option value="Pijama & Gecelik">Pijama & Gecelik</option>
                    <option value="Aksesuar & Çorap">Aksesuar & Çorap</option>
                </select>
            </div>
            <div class="form-group">
                <label>Görsel Bağlantısı (URL)</label>
                <input type="text" id="prodImg" placeholder="https://... (boş kalabilir)">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-save" onclick="saveProduct()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Bağlantı Bilgileri
        const SUPABASE_URL = "https://iwlysbmcjkhwpxkotnsz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_z7P_NGiXVLcLJxVTzxjiKA_8Su-pt8J"; // Supabase'deki Publishable Key'i buraya yapıştır
        const ADMIN_PASSWORD = "1234"; // Ailenle kullanacağın yönetici şifresi

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let cart = [];
        let activeCategory = 'Hepsi';
        let isAdmin = false;

        // Sayfa yüklendiğinde verileri çek
        window.onload = function() {
            fetchProducts();
        };

        // Supabase'den ürünleri canlı çekme
        async function fetchProducts() {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Hata:', error);
                document.getElementById('productGrid').innerHTML = '<div class="empty-state">Ürünler yüklenirken bir hata oluştu.</div>';
            } else {
                products = data || [];
                renderProducts();
            }
        }

        // Ürünleri Listeleme
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = products.filter(p => {
                const matchesCat = activeCategory === 'Hepsi' || p.cat === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.cat.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">Aradığınız kriterlere uygun ürün bulunamadı.</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="card">
                    <img src="${p.img || 'https://via.placeholder.com/300x300?text=G%C3%B6rsel+Yok'}" alt="${p.name}">
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.name}</div>
                            <div class="card-price">${p.price} TL</div>
                        </div>
                        <button class="btn-add" onclick="addToCart(${p.id})">🛒 Sepete Ekle</button>
                        ${isAdmin ? `
                            <div class="admin-controls">
                                <button class="btn-edit" onclick="editProduct(${p.id})">✏️ Düzenle</button>
                                <button class="btn-del" onclick="deleteProduct(${p.id})">🗑️ Sil</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Kategori Değiştirme
        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        // Sepet İşlemleri
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if (prod) {
                cart.push(prod);
                updateCartUI();
            }
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cartBar');
            if (cart.length > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = cart.length;
                const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
                document.getElementById('cartTotal').innerText = total + ' TL';
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return;
            let text = "Merhaba, katalog sitenizden şu ürünleri sipariş vermek istiyorum:\n\n";
            let total = 0;
            cart.forEach((item, idx) => {
                text += `${idx + 1}. ${item.name} - ${item.price} TL\n`;
                total += Number(item.price);
            });
            text += `\n*Toplam Tutar:* ${total} TL`;
            
            // Dükkan WhatsApp Numarası (Gerekirse değiştirebilirsin)
            const phone = "905000000000"; 
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Yönetici Panel İşlemleri
        function toggleAdminPanel() {
            if (!isAdmin) {
                const pass = prompt("Yönetici Şifresini Giriniz:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    alert("Yönetici modu aktifleşti! Artık ürün ekleyebilir, silebilir ve fiyat değiştirebilirsiniz.");
                    openModal();
                } else if (pass !== null) {
                    alert("Hatalı şifre!");
                }
            } else {
                openModal();
            }
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "Yeni Ürün Ekle";
            document.getElementById('editProductId').value = "";
            document.getElementById('prodName').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodImg').value = "";
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        async function saveProduct() {
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const cat = document.getElementById('prodCat').value;
            const img = document.getElementById('prodImg').value;

            if (!name || isNaN(price)) {
                alert("Lütfen geçerli bir ürün adı ve fiyatı giriniz.");
                return;
            }

            if (id) {
                // Güncelleme
                const { error } = await supabase
                    .from('products')
                    .update({ name, price, cat, img })
                    .eq('id', id);
                if (error) alert("Güncelleme hatası: " + error.message);
            } else {
                // Yeni Ekleme
                const { error } = await supabase
                    .from('products')
                    .insert([{ name, price, cat, img }]);
                if (error) alert("Ekleme hatası: " + error.message);
            }

            closeModal();
            fetchProducts();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (prod) {
                document.getElementById('modalTitle').innerText = "Ürünü Düzenle";
                document.getElementById('editProductId').value = prod.id;
                document.getElementById('prodName').value = prod.name;
                document.getElementById('prodPrice').value = prod.price;
                document.getElementById('prodCat').value = prod.cat;
                document.getElementById('prodImg').value = prod.img || "";
                document.getElementById('adminModal').style.display = 'flex';
            }
        }

        async function deleteProduct(id) {
            if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);
                if (error) alert("Silme hatası: " + error.message);
                else fetchProducts();
            }
        }
    </script>
</body>
</html>
